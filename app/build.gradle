plugins {
    alias libs.plugins.android.application
    alias libs.plugins.kotlin.compose
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream {
        localProps.load(it)
    }
}

def localOrEnv = { propName, envName ->
    return localProps[propName] ?: System.getenv(envName) ?: ''
}

def buildConfigString = { value ->
    return "\"${(value ?: '').toString().replace("\\", "\\\\").replace("\"", "\\\"")}\""
}

// CI assigns one timestamp-based version to both ABI builds and their OTA manifest.
def tvVersionCode = System.getenv('TV_VERSION_CODE') ?: '555'
if (!(tvVersionCode ==~ /[0-9]+/) || tvVersionCode.toBigInteger() < 1 || tvVersionCode.toBigInteger() > 2100000000) {
    throw new GradleException('TV_VERSION_CODE must be an integer between 1 and 2100000000')
}
def tvVersionName = System.getenv('TV_VERSION_NAME') ?: '5.5.5'

// Default package stays compatible with FongMi/TV upgrades. Pass -PtvApplicationId=com.wobuhui666.android.tv
// (or TV_APPLICATION_ID) to build the coexist edition that installs side by side with FongMi/TV.
def tvDefaultApplicationId = 'com.fongmi.android.tv'
def tvApplicationId = (project.findProperty('tvApplicationId') ?: System.getenv('TV_APPLICATION_ID') ?: tvDefaultApplicationId).toString().trim()
if (!(tvApplicationId ==~ /[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+/)) {
    throw new GradleException("Invalid tvApplicationId: ${tvApplicationId}")
}
def tvCoexist = tvApplicationId != tvDefaultApplicationId

android {
    namespace = 'com.fongmi.android.tv'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId tvApplicationId
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode tvVersionCode.toInteger()
        versionName tvVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "TMDB_API_KEY", buildConfigString(localOrEnv('tmdbApiKey', 'TMDB_API_KEY'))
        buildConfigField "String", "TMDB_LOGO_SIZE", buildConfigString(localOrEnv('tmdbLogoSize', 'TMDB_LOGO_SIZE') ?: 'w500')
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString(), "eventBusIndex": "com.fongmi.android.tv.event.EventIndex"]
            }
        }
    }

    flavorDimensions = ["mode", "abi"]

    productFlavors {
        leanback {
            dimension "mode"
        }
        mobile {
            dimension "mode"
        }
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
        viewBinding = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            // The Media3 FFmpeg extension and the MPV bundle deliberately ship the same
            // FFmpeg 9 shared libraries (verified byte-identical for both ABIs), so the
            // merge keeps one copy per ABI. libc++_shared likewise comes from NDK r29.
            pickFirsts.addAll(["**/libavcodec.so", "**/libavdevice.so", "**/libavfilter.so",
                               "**/libavformat.so", "**/libavutil.so", "**/libswresample.so",
                               "**/libswscale.so", "**/libc++_shared.so"])
        }
    }


    signingConfigs {
        release {
            storeFile localProps['storeFile'] ? file(localProps['storeFile']) : null
            keyAlias localProps['keyAlias']
            keyPassword localProps['keyPassword'] ?: localProps['storePassword']
            storePassword localProps['storePassword']
        }
    }

    sourceSets {
        // Both mode and ABI are flavor dimensions. Bind the TV preview explicitly
        // so a partial flavor/build-type directory cannot silently be ignored.
        preview {
            java.srcDirs += ['src/leanbackPreview/java', 'src/debug/java']
            manifest.srcFile 'src/leanbackPreview/AndroidManifest.xml'
        }
        if (providers.gradleProperty('tvPreview').isPresent()) {
            androidTest.java.srcDirs += 'src/tvPreviewTest/java'
        }
    }

    testBuildType = providers.gradleProperty('tvPreview').isPresent() ? 'preview' : 'debug'

    buildTypes {
        preview {
            initWith debug
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled = false
            shrinkResources = false
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules-media.pro'
        }
    }

    configurations.configureEach {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'com.android.support'
        resolutionStrategy {
            force libs.okhttp
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
        disable 'ExpiredTargetSdkVersion'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

androidComponents {
    beforeVariants(selector().withBuildType('preview')) { variant ->
        def mode = variant.productFlavors.find { it.first == 'mode' }?.second
        variant.enable = mode == 'leanback'
    }
    onVariants(selector().withBuildType('release')) { variant ->
        def flavors = variant.productFlavors.collectEntries { [(it.first): it.second] }
        def mode = flavors['mode'] ?: 'mode'
        def abi = flavors['abi'] ?: 'abi'
        variant.outputs.each { output ->
            output.outputFileName.set(tvCoexist ? "${mode}-${abi}-coexist.apk" : "${mode}-${abi}.apk")
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.aar"], exclude: ["mpv-android-lib-*.aar"])
    implementation project(":mpv")
    implementation project(":media3-av3a")
    implementation files('libs/sherpa-onnx-v1.13.4.jar')
    implementation project(':catvod')
    implementation project(':chaquo')
    implementation project(':quickjs')
    implementation libs.appcompat
    implementation libs.coroutines.android
    implementation libs.lifecycle.service
    implementation libs.bundles.media3
    // The FFmpeg extension module is not published to Google Maven; it exists only in the
    // composite Media3 build, so plain builds keep the previous renderer chain unchanged.
    if (!(System.getenv("MEDIA3_SOURCE_DIR") ?: "").isBlank()) {
        implementation libs.media3.decoder.ffmpeg
    }
    implementation project(':subtitle-ass')
    implementation libs.palette
    implementation libs.recyclerview
    implementation libs.room.runtime
    implementation libs.splashscreen
    implementation libs.swiperefreshlayout
    implementation libs.viewpager2
    implementation libs.android.gif.drawable
    implementation libs.bundles.glide
    implementation libs.bundles.jupnp
    implementation libs.customactivityoncrash
    implementation libs.eventbus
    implementation libs.flexbox
    implementation libs.lottie
    implementation libs.material
    implementation libs.materialdesigncolors
    implementation libs.nanohttpd
    implementation libs.newpipeextractor
    implementation libs.permissionx
    implementation libs.simple.xml
    implementation libs.textdrawable
    leanbackImplementation libs.leanback
    leanbackImplementation libs.androidautosize
    leanbackImplementation platform(libs.compose.bom)
    leanbackImplementation libs.compose.foundation
    leanbackImplementation libs.compose.material3
    leanbackImplementation libs.compose.tv.material
    leanbackImplementation libs.compose.ui
    mobileImplementation libs.biometric
    mobileImplementation libs.zxing.android.embedded
    annotationProcessor libs.room.compiler
    annotationProcessor libs.eventbus.annotation.processor
    annotationProcessor libs.glide.compiler
    testImplementation libs.junit
    testImplementation "com.squareup.okhttp3:mockwebserver:5.5.0"
    testImplementation "org.json:json:20250517"
    androidTestImplementation libs.junit
    androidTestImplementation libs.conscrypt.android
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    coreLibraryDesugaring libs.desugar
}
