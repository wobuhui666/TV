name: Library source compatibility

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Full baseline commit SHA; blank uses the dispatch commit's parent
        type: string
        default: ''
      probe_only:
        description: Build the corrected AndroidTest probe only against the fixed source
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: library-source-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: TV ARM64 ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        stage: ${{ inputs.probe_only && fromJSON('["fixed"]') || fromJSON('["baseline","fixed"]') }}
    env:
      COMPATIBILITY_STAGE: ${{ matrix.stage }}
      DISPATCH_COMMIT: ${{ github.sha }}
      INPUT_BASELINE_REF: ${{ inputs.baseline_ref }}
      TV_BUILD_APPLICATION_ID: com.fongmi.android.tv.sourceprobe
      MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      ASSRT_API_TOKEN: ${{ secrets.ASSRT_API_TOKEN }}
      TMDB_LOGO_SIZE: ${{ vars.TMDB_LOGO_SIZE }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Select immutable baseline or fixed source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$INPUT_BASELINE_REF" ]; then
            [[ "$INPUT_BASELINE_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'baseline_ref must be a full commit SHA'; exit 1; }
            git fetch --no-tags --depth=1 origin "$INPUT_BASELINE_REF"
            baseline_sha=$(git rev-parse FETCH_HEAD)
          else
            baseline_sha=$(git rev-parse "${DISPATCH_COMMIT}^")
          fi
          printf 'BASELINE_COMMIT=%s\n' "$baseline_sha" >> "$GITHUB_ENV"
          if [ "$COMPATIBILITY_STAGE" = baseline ]; then
            probe_dir="$RUNNER_TEMP/library-source-probes"
            mkdir -p "$probe_dir"
            for probe in LibrarySourceCompatibilityAndroidTest.kt LibrarySourcePlaybackAndroidTest.kt; do
              cp "app/src/androidTest/java/com/fongmi/android/tv/test/$probe" "$probe_dir/$probe"
            done
            git checkout --detach "$baseline_sha"
            for probe in LibrarySourceCompatibilityAndroidTest.kt LibrarySourcePlaybackAndroidTest.kt; do
              cp "$probe_dir/$probe" "app/src/androidTest/java/com/fongmi/android/tv/test/$probe"
            done
          fi
          printf 'APPLICATION_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Android SDK 37.0 and native toolchain
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.22.1'

      - name: Checkout fixed Media3 fork
        uses: actions/checkout@v4
        with:
          repository: wobuhui666/media
          ref: 342f6590e02ac390e0bd6b4488b8a1bff55747c1
          path: .media3
          fetch-depth: 1
          persist-credentials: false

      - name: Configure SDK, composite build and debug signing
        shell: bash
        run: |
          set -euo pipefail
          printf 'toolchainVersion=21\n' > gradle/gradle-daemon-jvm.properties
          test -d .media3/build-logic
          test -d .media3/build-logic-settings
          test -f .media3/libraries/ui_danmaku/build.gradle.kts
          cp .github/media3-composite-settings.gradle.kts .media3/settings.gradle.kts
          test ! -f local.properties
          cat > "$RUNNER_TEMP/tv-library-source.init.gradle" <<'GRADLE'
          def appId = System.getenv('TV_BUILD_APPLICATION_ID')
          if (!(appId in ['com.fongmi.android.tv.sourceprobe', 'com.fongmi.android.tv'])) {
              throw new GradleException('Unexpected library source build application ID')
          }
          gradle.beforeProject { p ->
              ['com.android.application', 'com.android.library'].each { pluginId ->
                  p.pluginManager.withPlugin(pluginId) {
                      p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                          if (dsl.compileSdk == 37) dsl.compileSdkMinor = 0
                          if (p.path == ':app' && pluginId == 'com.android.application') {
                              dsl.defaultConfig.applicationId = appId
                              dsl.defaultConfig.testApplicationId = "${appId}.test"
                              dsl.buildTypes.getByName('debug').signingConfig = dsl.signingConfigs.getByName('debug')
                          }
                      }
                  }
              }
          }
          GRADLE
          chmod +x ./gradlew
          mkdir -p "artifacts/$COMPATIBILITY_STAGE"

      - name: Build isolated TV application and AndroidTest APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -I "$RUNNER_TEMP/tv-library-source.init.gradle" \
            :app:assembleLeanbackArm64_v8aDebug \
            :app:assembleLeanbackArm64_v8aDebugAndroidTest \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.parallel=false \
            '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED' \
            --no-daemon --build-cache --max-workers=2 --console=plain

      - name: Collect isolated APKs and immutable build metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess
          stage = os.environ['COMPATIBILITY_STAGE']
          destination = pathlib.Path('artifacts') / stage
          app_id = 'com.fongmi.android.tv.sourceprobe'
          aapt = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/37.0.0/aapt'
          groups = {
              'app': pathlib.Path('app/build/outputs/apk/leanbackArm64_v8a/debug'),
              'test': pathlib.Path('app/build/outputs/apk/androidTest/leanbackArm64_v8a/debug'),
          }
          metadata = {
              'stage': stage,
              'applicationCommit': os.environ['APPLICATION_COMMIT'],
              'baselineCommit': os.environ['BASELINE_COMMIT'],
              'dispatchCommit': os.environ['DISPATCH_COMMIT'],
              'androidTestProbeCommit': os.environ['DISPATCH_COMMIT'],
              'media3Commit': subprocess.check_output(['git', '-C', '.media3', 'rev-parse', 'HEAD'], text=True).strip(),
              'abi': 'arm64-v8a', 'buildType': 'debug', 'signing': 'debug',
              'jdk': 21, 'python': '3.10', 'compileSdk': '37.0',
              'instrumentationExecuted': False, 'files': [],
          }
          for role, directory in groups.items():
              candidates = list(directory.glob('*.apk'))
              if len(candidates) != 1:
                  raise SystemExit(f'Expected one {role} APK, found {len(candidates)}')
              source = candidates[0]
              expected = app_id + ('.test' if role == 'test' else '')
              badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(source)], text=True)
              actual = re.search(r"^package: name='([^']+)'", badging, re.MULTILINE)
              if actual is None or actual.group(1) != expected:
                  raise SystemExit('Unexpected APK application ID')
              if role == 'test':
                  manifest = subprocess.check_output([str(aapt), 'dump', 'xmltree', str(source), 'AndroidManifest.xml'], text=True)
                  if not re.search(r'android:targetPackage[^\n]*="' + re.escape(app_id) + r'"', manifest):
                      raise SystemExit('Unexpected AndroidTest target package')
              output = destination / f'sourceprobe-{stage}-{role}-arm64-debug.apk'
              shutil.copy2(source, output)
              metadata['files'].append({'file': output.name, 'role': role, 'applicationId': expected,
                                        'bytes': output.stat().st_size,
                                        'sha256': hashlib.sha256(output.read_bytes()).hexdigest()})
          (destination / 'build-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY

      - name: Run focused fixed-source regression tests
        if: matrix.stage == 'fixed'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -I "$RUNNER_TEMP/tv-library-source.init.gradle" \
            :app:testLeanbackArm64_v8aDebugUnitTest \
            --tests '*LibrarySourceMatcher*' \
            --tests '*LibrarySearchIndexTest' \
            --tests '*ExplicitEpisodeSelectionTest' \
            --tests '*LibraryPlaybackPrefetchTest' \
            --tests '*MovieSelectionTest' \
            --tests '*LibraryEpisodeSelectionTest' \
            --tests '*LibraryEpisodeNavigationTest' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.parallel=false \
            '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED' \
            --no-daemon --build-cache --max-workers=2 --console=plain

      - name: Build fixed TV ARM64 user APK
        if: matrix.stage == 'fixed' && !inputs.probe_only
        shell: bash
        env:
          TV_BUILD_APPLICATION_ID: com.fongmi.android.tv
        run: |
          set -euo pipefail
          ./gradlew -I "$RUNNER_TEMP/tv-library-source.init.gradle" \
            :app:assembleLeanbackArm64_v8aDebug \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.parallel=false \
            '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED' \
            --no-daemon --build-cache --max-workers=2 --console=plain
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess
          directory = pathlib.Path('app/build/outputs/apk/leanbackArm64_v8a/debug')
          candidates = list(directory.glob('*.apk'))
          if len(candidates) != 1:
              raise SystemExit('Expected one fixed TV APK')
          source = candidates[0]
          aapt = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/37.0.0/aapt'
          badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(source)], text=True)
          actual = re.search(r"^package: name='([^']+)'", badging, re.MULTILINE)
          if actual is None or actual.group(1) != 'com.fongmi.android.tv':
              raise SystemExit('Unexpected fixed user APK application ID')
          destination = pathlib.Path('artifacts/fixed')
          output = destination / 'TV-library-source-fix-arm64-debug.apk'
          shutil.copy2(source, output)
          metadata_file = destination / 'build-metadata.json'
          metadata = json.loads(metadata_file.read_text())
          metadata['files'].append({'file': output.name, 'role': 'user-app',
                                    'applicationId': 'com.fongmi.android.tv',
                                    'bytes': output.stat().st_size,
                                    'sha256': hashlib.sha256(output.read_bytes()).hexdigest()})
          metadata_file.write_text(json.dumps(metadata, indent=2) + '\n')
          PY

      - name: Collect focused unit test summary
        if: always() && matrix.stage == 'fixed'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          destination = pathlib.Path('artifacts/fixed')
          destination.mkdir(parents=True, exist_ok=True)
          source = pathlib.Path('app/build/test-results/testLeanbackArm64_v8aDebugUnitTest')
          suites = []
          for report in sorted(source.glob('TEST-*.xml')):
              suite = ET.parse(report).getroot()
              suites.append({'class': suite.get('name'),
                             **{field: int(suite.get(field, 0)) for field in ('tests', 'failures', 'errors', 'skipped')}})
          totals = {field: sum(suite[field] for suite in suites) for field in ('tests', 'failures', 'errors', 'skipped')}
          expected = {
              'com.fongmi.android.tv.source.LibrarySourceMatcherEpisodeEvidenceTest',
              'com.fongmi.android.tv.source.LibrarySourceMatcherPreparedTest',
              'com.fongmi.android.tv.source.LibrarySearchIndexTest',
              'com.fongmi.android.tv.source.ExplicitEpisodeSelectionTest',
              'com.fongmi.android.tv.playback.vod.LibraryPlaybackPrefetchTest',
              'com.fongmi.android.tv.source.MovieSelectionTest',
              'com.fongmi.android.tv.source.LibraryEpisodeSelectionTest',
              'com.fongmi.android.tv.source.LibraryEpisodeNavigationTest',
          }
          missing = sorted(expected - {suite['class'] for suite in suites if suite['tests'] > 0})
          summary = {'applicationCommit': os.environ.get('APPLICATION_COMMIT', ''),
                     'passed': not missing and totals['failures'] == 0 and totals['errors'] == 0 and totals['skipped'] == 0,
                     **totals, 'missingSuites': missing, 'suites': suites}
          (destination / 'unit-test-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          if not summary['passed']:
              raise SystemExit('Focused library source regressions did not all complete successfully')
          PY

      - name: Upload stage APKs and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-library-source-${{ matrix.stage }}-arm64-${{ github.run_id }}
          path: artifacts/${{ matrix.stage }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload focused unit test reports
        if: always() && matrix.stage == 'fixed'
        uses: actions/upload-artifact@v4
        with:
          name: tv-library-source-fixed-unit-tests-${{ github.run_id }}
          path: |
            app/build/test-results/testLeanbackArm64_v8aDebugUnitTest/
            app/build/reports/tests/testLeanbackArm64_v8aDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
