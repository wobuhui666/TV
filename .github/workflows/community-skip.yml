name: Community intro and outro validation

on:
  push:
    branches: ['feat/community-intro-segments']
  workflow_dispatch:
    inputs:
      live_navigation:
        description: Also verify navigation with the live aiwex configuration
        type: boolean
        default: false
      live_config:
        description: Verify the private runtime configuration and real community skip lookups
        type: boolean
        default: false
      playlist_fixture:
        description: Verify extracted real playlist labels with a controlled H264 video
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: community-skip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
    steps:
      - name: Free runner space for Android builds
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/swift /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'
      - name: Probe public segment metadata contracts
        run: python3 .github/scripts/check-community-skip.py
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Checkout the fixed Media3 fork
        uses: actions/checkout@v4
        with:
          repository: wobuhui666/media
          ref: 342f6590e02ac390e0bd6b4488b8a1bff55747c1
          path: .media3
          persist-credentials: false
      - name: Prepare the composite build and SDK
        run: |
          printf 'toolchainVersion=21\n' > gradle/gradle-daemon-jvm.properties
          cp .github/media3-composite-settings.gradle.kts .media3/settings.gradle.kts
          cat > "$RUNNER_TEMP/tv-sdk-compat.init.gradle" <<'GRADLE'
          gradle.beforeProject { p ->
              ['com.android.application', 'com.android.library'].each { pluginId ->
                  p.pluginManager.withPlugin(pluginId) {
                      p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                          if (dsl.compileSdk == 37) dsl.compileSdkMinor = 0
                      }
                  }
              }
          }
          GRADLE
          python3 - <<'PY'
          import pathlib, re
          wrapper = pathlib.Path('gradle/wrapper/gradle-wrapper.properties')
          properties = wrapper.read_text()
          assert 'gradle-9.1.0-bin.zip' in properties, 'Unexpected Gradle version'
          properties = re.sub(r'^distributionUrl=.*$', 'distributionUrl=https\\://github.com/gradle/gradle-distributions/releases/download/v9.1.0/gradle-9.1.0-bin.zip?download=1', properties, flags=re.M)
          properties = re.sub(r'^(distributionSha256Sum|networkTimeout)=.*\n?', '', properties, flags=re.M)
          wrapper.write_text(properties.rstrip() + '\ndistributionSha256Sum=a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806\nnetworkTimeout=60000\n')
          PY
          chmod +x gradlew
      - name: Run application regression tests and compile mobile settings
        run: ./gradlew -I "$RUNNER_TEMP/tv-sdk-compat.init.gradle" :app:testLeanbackArm64_v8aDebugUnitTest :app:compileMobileArm64_v8aDebugJavaWithJavac --no-daemon --build-cache --max-workers=2 --console=plain
      - name: Build the production TV app and instrumentation
        run: ./gradlew -I "$RUNNER_TEMP/tv-sdk-compat.init.gradle" :app:assembleLeanbackArm64_v8aDebug :app:assembleLeanbackArm64_v8aDebugAndroidTest --no-daemon --build-cache --max-workers=2 --console=plain
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-skip-unit-tests-${{ github.run_id }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
            artifacts/community-skip/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload TV debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: community-skip-arm64-debug-${{ github.run_id }}
          path: |
            app/build/outputs/apk/leanbackArm64_v8a/debug/*.apk
            app/build/outputs/apk/androidTest/leanbackArm64_v8a/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  live-navigation:
    if: github.event_name == 'workflow_dispatch' && inputs.live_navigation
    uses: ./.github/workflows/app-responsiveness.yml
    with:
      baseline_ref: '529d3fffc94dd83cbf5d9241db1b45d4a7e7e39f'
      compare_baseline: false
      polish: false
  background-playback:
    name: Android community skip background acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
      TMDB_API_KEY: community-skip-ui-fixture
      ASSRT_API_TOKEN: community-skip-ui-fixture
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'
      - name: Install image tools
        run: python -m pip install Pillow
      - name: Install the controlled video generator
        if: inputs.playlist_fixture
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Set up Android SDK 37.0
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.22.1'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Checkout pinned Media3 fork
        uses: actions/checkout@v4
        with:
          repository: wobuhui666/media
          ref: 342f6590e02ac390e0bd6b4488b8a1bff55747c1
          path: .media3
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare SDK and composite build
        run: |
          printf 'toolchainVersion=21\n' > gradle/gradle-daemon-jvm.properties
          test ! -f local.properties
          test -d .media3/build-logic
          test -d .media3/build-logic-settings
          test -f .media3/libraries/ui_danmaku/build.gradle.kts
          cp .github/media3-composite-settings.gradle.kts .media3/settings.gradle.kts
          cat > "$RUNNER_TEMP/community-skip-sdk.init.gradle" <<'GRADLE'
          gradle.beforeProject { p ->
              ['com.android.application', 'com.android.library'].each { pluginId ->
                  p.pluginManager.withPlugin(pluginId) {
                      p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                          if (dsl.compileSdk == 37) dsl.compileSdkMinor = 0
                      }
                  }
              }
          }
          GRADLE
          python3 - <<'PY'
          import pathlib, re
          wrapper = pathlib.Path('gradle/wrapper/gradle-wrapper.properties')
          properties = wrapper.read_text()
          assert 'gradle-9.1.0-bin.zip' in properties, 'Unexpected Gradle version'
          properties = re.sub(r'^distributionUrl=.*$', 'distributionUrl=https\\://github.com/gradle/gradle-distributions/releases/download/v9.1.0/gradle-9.1.0-bin.zip?download=1', properties, flags=re.M)
          properties = re.sub(r'^(distributionSha256Sum|networkTimeout)=.*\n?', '', properties, flags=re.M)
          wrapper.write_text(properties.rstrip() + '\ndistributionSha256Sum=a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806\nnetworkTimeout=60000\n')
          PY
          chmod +x gradlew
      - name: Build isolated preview and run application unit tests
        run: |
          ./gradlew -I "$RUNNER_TEMP/community-skip-sdk.init.gradle" \
            :app:assembleLeanbackArm64_v8aPreview \
            :app:assembleLeanbackArm64_v8aPreviewAndroidTest \
            :app:testLeanbackArm64_v8aPreviewUnitTest \
            -PtvPreview --no-daemon --build-cache --max-workers=2 --console=plain
      - name: Prepare pinned x86_64 preview libraries
        run: python3 .github/scripts/prepare-quickjs-preview.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare isolated emulator checks
        env:
          COMMUNITY_SKIP_LIVE_CONFIG: ${{ inputs.live_config }}
          COMMUNITY_SKIP_REAL_PLAYLIST: ${{ inputs.playlist_fixture }}
        run: |
          cat > "$RUNNER_TEMP/verify-community-skip-android.sh" <<'VERIFY'
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          outputs = (
              ('app/build/outputs/apk/leanbackArm64_v8a/preview', 'com.fongmi.android.tv.preview'),
              ('app/build/outputs/apk/androidTest/leanbackArm64_v8a/preview', 'com.fongmi.android.tv.preview.test'),
          )
          for root, package in outputs:
              directory = pathlib.Path(root)
              data = json.loads((directory / 'output-metadata.json').read_text())
              assert len(data['elements']) == 1, 'Expected one isolated preview APK'
              assert data['applicationId'] == package, 'Unexpected APK application ID'
              subprocess.run(['adb', 'install', '-r', str(directory / data['elements'][0]['outputFile'])], check=True)
          PY
          adb shell wm size 1920x1080
          adb shell wm density 320
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell pm grant com.fongmi.android.tv.preview android.permission.POST_NOTIFICATIONS
          # The disposable Pixel launcher can retain a boot-time ANR dialog and steal app focus.
          adb shell am force-stop com.google.android.apps.nexuslauncher
          if [ "$COMMUNITY_SKIP_REAL_PLAYLIST" = 'true' ]; then
            bash .github/scripts/verify-community-skip-playlists.sh
          elif [ "$COMMUNITY_SKIP_LIVE_CONFIG" = 'true' ]; then
            bash .github/scripts/verify-community-skip-live.sh
          else
            UPSTREAM_NATIVE_UI_EVIDENCE=true bash .github/scripts/verify-upstream-features.sh \
              'com.fongmi.android.tv.player.skip.CommunitySkipPlaybackAndroidTest,com.fongmi.android.tv.player.skip.CommunitySkipRuntimeAndroidTest' \
              artifacts/community-skip-android '2,8'
          fi
          VERIFY
      - name: Stage private live verification inputs
        if: inputs.live_config && !inputs.playlist_fixture
        env:
          LIVE_CONFIG_URL: ${{ secrets.COMMUNITY_SKIP_LIVE_CONFIG_URL }}
          LIVE_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, urllib.parse
          url = os.environ.get('LIVE_CONFIG_URL', '').strip()
          parsed = urllib.parse.urlsplit(url)
          assert parsed.scheme == 'https' and parsed.hostname, 'A private HTTPS configuration is required'
          key = os.environ.get('LIVE_TMDB_KEY', '').strip()
          assert re.fullmatch(r'[a-fA-F0-9]{32}', key), 'A runtime TMDB credential is required'
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'community-skip-live-input'
          directory.mkdir(mode=0o700, exist_ok=True)
          directory.chmod(0o700)
          for name, content in (('source-url.txt', url), ('tmdb-key.txt', key)):
              target = directory / name
              target.write_text(content)
              target.chmod(0o600)
          PY
      - name: Stage real playlist metadata and controlled video
        if: inputs.playlist_fixture
        env:
          LIVE_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, shutil
          key = os.environ.get('LIVE_TMDB_KEY', '').strip()
          assert re.fullmatch(r'[a-fA-F0-9]{32}', key), 'A runtime TMDB credential is required'
          source = pathlib.Path('app/src/androidTest/fixtures/community-skip/playlists.json')
          fixture = json.loads(source.read_text())
          assert fixture.get('schema') == 'tv.community-skip-playlist-fixture.v1'
          assert fixture.get('cases'), 'Extracted real playlist cases are required'
          assert key not in source.read_text(), 'A credential cannot enter a fixture'
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'community-skip-playlist-input'
          directory.mkdir(mode=0o700, exist_ok=True)
          directory.chmod(0o700)
          shutil.copyfile(source, directory / 'fixtures.json')
          (directory / 'fixtures.json').chmod(0o600)
          (directory / 'tmdb-key.txt').write_text(key)
          (directory / 'tmdb-key.txt').chmod(0o600)
          PY
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=320x180:rate=10' \
            -t 90 -an -c:v libx264 -profile:v baseline -level:v 3.0 -pix_fmt yuv420p \
            -preset ultrafast -g 10 -bf 0 -threads 2 -movflags +faststart \
            "$RUNNER_TEMP/community-skip-playlist-input/video.mp4"
          chmod 600 "$RUNNER_TEMP/community-skip-playlist-input/video.mp4"
      - name: Verify delayed metadata and actual Exo skipping on Android API 34
        timeout-minutes: 20
        env:
          COMMUNITY_SKIP_LIVE_CONFIG: ${{ inputs.live_config }}
          COMMUNITY_SKIP_REAL_PLAYLIST: ${{ inputs.playlist_fixture }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot -memory 2048
          script: bash "$RUNNER_TEMP/verify-community-skip-android.sh"
      - name: Remove private live verification inputs
        if: always() && (inputs.live_config || inputs.playlist_fixture)
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          shutil.rmtree(pathlib.Path(os.environ['RUNNER_TEMP']) / 'community-skip-live-input', ignore_errors=True)
          shutil.rmtree(pathlib.Path(os.environ['RUNNER_TEMP']) / 'community-skip-playlist-input', ignore_errors=True)
          PY
      - name: Upload Android screenshots, summaries and unit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-skip-android-${{ github.run_id }}
          path: |
            artifacts/community-skip-android/
            artifacts/community-skip-live/
            artifacts/community-skip-playlists/
            app/build/test-results/
            app/build/reports/tests/
            app/schemas/
          if-no-files-found: warn
          retention-days: 14
