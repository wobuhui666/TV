name: Exo high bitrate playback comparison

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: exo-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/checkout@v4
        with:
          repository: wobuhui666/media
          ref: 342f6590e02ac390e0bd6b4488b8a1bff55747c1
          path: .media3
          persist-credentials: false
      - name: Prepare pinned runtime and comparison classes
        run: |
          printf 'toolchainVersion=21\n' > gradle/gradle-daemon-jvm.properties
          cp .github/media3-composite-settings.gradle.kts .media3/settings.gradle.kts
          python3 tools/testing/playback-stutter/prepare_android_comparison.py
          cat > "$RUNNER_TEMP/tv-sdk-compat.init.gradle" <<'GRADLE'
          gradle.beforeProject { p ->
              ['com.android.application', 'com.android.library'].each { pluginId ->
                  p.pluginManager.withPlugin(pluginId) {
                      p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                          if (dsl.compileSdk == 37) dsl.compileSdkMinor = 0
                      }
                  }
              }
          }
          GRADLE
          chmod +x gradlew
      - name: Build shipping playback code and regression tests
        run: |
          ./gradlew -I "$RUNNER_TEMP/tv-sdk-compat.init.gradle" \
            :app:assembleLeanbackArm64_v8aPreview :app:assembleLeanbackArm64_v8aPreviewAndroidTest \
            :app:testLeanbackArm64_v8aPreviewUnitTest -PtvPreview --no-daemon --build-cache --max-workers=2 --console=plain
          python3 tools/testing/playback-stutter/verify.py
          python3 -m unittest discover -s third_party/media3 -p 'test_*.py' -v
          mkdir -p artifacts/arm64-diagnostics
          cp app/build/outputs/apk/leanbackArm64_v8a/preview/*.apk artifacts/arm64-diagnostics/
      - name: Prepare exact native libraries for the disposable emulator package
        run: |
          python3 .github/scripts/prepare-quickjs-preview.py
          python3 tools/testing/playback-stutter/prepare_libass_preview.py
      - name: Generate measured synthetic 1080p and 4K video
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 tools/testing/playback-stutter/generate_media_fixtures.py --output-dir "$RUNNER_TEMP/playback-media"
          mkdir -p artifacts/playback-stutter
          cp "$RUNNER_TEMP/playback-media/manifest.json" artifacts/playback-stutter/fixture-manifest.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure Android 11 playback and renderer mapping
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048
          script: bash tools/testing/playback-stutter/run_android_comparison.sh
      - name: Upload measurements and regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exo-performance-${{ github.run_id }}
          path: |
            artifacts/playback-stutter/
            app/build/test-results/
            app/build/reports/tests/
          retention-days: 14
      - name: Upload ARM64 diagnostics build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exo-diagnostics-preview-${{ github.run_id }}
          path: artifacts/arm64-diagnostics/*.apk
          retention-days: 14
