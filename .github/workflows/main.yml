name: Build TV release (manual)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "更新说明；留空使用当前提交标题"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Assign release version
        run: python3 tools/ota-release.py version >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK 37.0
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "13114758"
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.22.1"

      - name: Configure SDK 37.0 target
        run: |
          # Use the JDK installed above, as in the automatic release workflow.
          printf 'toolchainVersion=21\n' > gradle/gradle-daemon-jvm.properties
          cat > "$RUNNER_TEMP/tv-sdk-compat.init.gradle" <<'GRADLE'
          gradle.beforeProject { p ->
              ['com.android.application', 'com.android.library'].each { pluginId ->
                  p.pluginManager.withPlugin(pluginId) {
                      p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                          if (dsl.compileSdk == 37) dsl.compileSdkMinor = 0
                      }
                  }
              }
          }
          GRADLE

      - name: Checkout Media3 fork
        uses: actions/checkout@v4
        with:
          repository: wobuhui666/media
          ref: release-1.11.0-fongmi
          path: .media3
          fetch-depth: 1

      - name: Limit Media3 composite modules
        run: |
          test -d .media3/build-logic
          test -d .media3/build-logic-settings
          test -f .media3/libraries/ui_danmaku/build.gradle.kts
          for module in lib-inspector test-data test-utils test-utils-robolectric; do
            test -f ".github/media3-stubs/$module/build.gradle"
          done
          cp .github/media3-composite-settings.gradle.kts .media3/settings.gradle.kts

      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD || secrets.STORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ASSRT_API_TOKEN: ${{ secrets.ASSRT_API_TOKEN }}
          TMDB_LOGO_SIZE: ${{ vars.TMDB_LOGO_SIZE }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=../release.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
          } > local.properties
          if [ -n "$TMDB_API_KEY" ]; then echo "tmdbApiKey=$TMDB_API_KEY" >> local.properties; fi
          if [ -n "$ASSRT_API_TOKEN" ]; then echo "assrtApiToken=$ASSRT_API_TOKEN" >> local.properties; fi
          if [ -n "$TMDB_LOGO_SIZE" ]; then echo "tmdbLogoSize=$TMDB_LOGO_SIZE" >> local.properties; fi

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Build release APKs
        env:
          MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
        run: ./gradlew -I "$RUNNER_TEMP/tv-sdk-compat.init.gradle" assembleLeanbackArm64_v8aRelease assembleLeanbackArmeabi_v7aRelease --no-daemon --build-cache --max-workers=2

      - name: Validate APKs and generate OTA manifest
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_ota_release.py'
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="$(git log -1 --pretty=%s)"
          fi
          python3 tools/ota-release.py manifest \
            --apk-root app/build/outputs/apk \
            --repository "$RELEASE_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --mode leanback \
            --desc="$RELEASE_NOTES" \
            --output app/build/outputs/ota/leanback.json

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/**/release/*.apk
            app/build/outputs/ota/*.json
          retention-days: 14

      - name: Upload complete release as draft
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.run_number }}"
          tag_name: "build-${{ github.run_id }}-${{ github.run_attempt }}"
          target_commitish: ${{ github.sha }}
          draft: true
          make_latest: false
          prerelease: ${{ github.ref != 'refs/heads/ui/apple-tv-redesign' }}
          fail_on_unmatched_files: true
          body: |
            Source: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            Branch: `${{ github.ref_name }}`

            Android TV APKs for ARM64 and ARMv7. Choose the ABI supported by your Android system.
          files: |
            app/build/outputs/apk/**/release/*.apk
            app/build/outputs/ota/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_LATEST: ${{ github.ref == 'refs/heads/ui/apple-tv-redesign' }}
          RELEASE_PRERELEASE: ${{ github.ref != 'refs/heads/ui/apple-tv-redesign' }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
            --draft=false --latest="$RELEASE_LATEST" --prerelease="$RELEASE_PRERELEASE"
