name: Rebuild MPV FFmpeg for HiSilicon

on:
  push:
    branches: [fix/issue134-mpv-hisi]
    paths:
      - .github/workflows/mpv-native-hisi.yml
      - third_party/mpv/build_hisi_ffmpeg.py
      - third_party/mpv/patches/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpv-hisi-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;29.0.14206865'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config ninja-build cmake gperf
          python -m pip install meson==1.10.1
      - name: Check original and patched format mapping
        run: python3 third_party/mpv/verify_hisi_nv21.py
      - name: Rebuild pinned FFmpeg with original feature set
        run: |
          python3 third_party/mpv/build_hisi_ffmpeg.py \
            --ndk "$ANDROID_HOME/ndk/29.0.14206865" \
            --abi '${{ matrix.abi }}' --jobs 2 \
            --work "$RUNNER_TEMP/hisi-native" --output native-result \
            2>&1 | tee native-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hisi-ffmpeg-${{ matrix.abi }}
          path: |
            native-result/
            native-build.log
          if-no-files-found: error
          retention-days: 14
