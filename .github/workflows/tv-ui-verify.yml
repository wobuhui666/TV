name: TV appearance and touch verification

on:
  push:
    branches: ['feat/tv-touch-light-theme']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install Pillow
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Checkout Media3 fork
        uses: actions/checkout@v4
        with:
          repository: wobuhui666/media
          ref: release-1.11.0-fongmi
          path: .media3
      - name: Prepare SDK and composite build
        run: |
          cp .github/media3-composite-settings.gradle.kts .media3/settings.gradle.kts
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
          chmod +x gradlew
      - name: Build TV preview and run local unit tests
        env:
          MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
        run: ./gradlew :app:assembleLeanbackArm64_v8aPreview :app:assembleLeanbackArm64_v8aPreviewAndroidTest :app:testLeanbackArm64_v8aPreviewUnitTest -PtvPreview --no-daemon --max-workers=2 --console=plain
      - name: Upload preview APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-preview-apk
          path: app/build/outputs/apk/leanbackArm64_v8a/preview/*.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify themes and touch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/verify-tv-ui.sh
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-ui-verification-${{ github.run_id }}
          path: |
            artifacts/tv-ui/
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
