name: TV appearance and touch verification

on:
  push:
    branches: ['feat/tv-touch-light-theme', 'feat/tv-touch-light-theme-issue77', 'fix/home-history-order-touch']
  workflow_dispatch:
    inputs:
      playback_clock:
        description: Verify the persistent TV playback clock, settings and native screenshots
        type: boolean
        default: false
      guarded_source:
        description: Verify real guarded sources in the ARM64 sourceprobe package
        type: boolean
        default: false
      preload:
        description: Include native next-episode cache regressions
        type: boolean
        default: false
      episode_navigation:
        description: Verify episode identity, mixed-release controller navigation and Android Parcel
        type: boolean
        default: false
      variety_episodes:
        description: Verify variety dates, issue parts, content versions and API identity guards
        type: boolean
        default: false
      assrt_subtitles:
        description: Verify ASSRT search, file selection, download and real Exo subtitle loading
        type: boolean
        default: false
      upstream_stability:
        description: Verify upstream folder, episode, playback ownership and subtitle regressions
        type: boolean
        default: false
      wasm:
        description: Verify real QuickJS WASM and legacy spider compatibility on Android API 24 and 34
        type: boolean
        default: false
      responsiveness:
        description: Measure app responsiveness with the live aiwex configuration
        type: boolean
        default: false
      polish:
        description: Verify poster-wall filters, subtitle labels and source-form hints
        type: boolean
        default: false
      compact_home:
        description: Verify compact home, filter-only discovery, source actions and library navigation
        type: boolean
        default: false
      home_background:
        description: Verify native home artwork blending with wallpaper on and off
        type: boolean
        default: false
      live_home:
        description: Capture real TMDB homepage with a runtime Actions credential
        type: boolean
        default: false
      baseline_ref:
        description: Baseline commit for responsiveness comparison
        type: string
        default: '839ec53dea1a01879cbc42d11e7a7a475768c67e'
      compare_baseline:
        description: Also build the baseline, or rerun only optimized checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: tv-ui-${{ github.ref }}-${{ inputs.wasm && 'wasm' || inputs.guarded_source && 'guarded-source' || inputs.variety_episodes && 'variety-episodes' || inputs.upstream_stability && 'fongmi-stability' || inputs.home_background && 'home-background' || inputs.live_home && 'live-home' || 'appearance' }}
  cancel-in-progress: true

jobs:
  guarded-source:
    if: github.event_name == 'workflow_dispatch' && inputs.guarded_source && !inputs.wasm
    uses: ./.github/workflows/guarded-source-verify.yml
    with:
      preload: ${{ inputs.preload }}
  responsiveness:
    if: github.event_name == 'workflow_dispatch' && (inputs.responsiveness || inputs.polish) && !inputs.guarded_source && !inputs.wasm
    uses: ./.github/workflows/app-responsiveness.yml
    with:
      baseline_ref: ${{ inputs.baseline_ref }}
      compare_baseline: ${{ inputs.compare_baseline }}
      polish: ${{ inputs.polish }}
  verify:
    if: ${{ inputs.wasm || (!inputs.responsiveness && !inputs.polish && !inputs.guarded_source) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.wasm && '[24,34]' || '[34]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install Pillow
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Checkout Media3 fork
        uses: actions/checkout@v4
        with:
          repository: wobuhui666/media
          ref: 342f6590e02ac390e0bd6b4488b8a1bff55747c1
          path: .media3
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare SDK and composite build
        run: |
          printf 'toolchainVersion=21\n' > gradle/gradle-daemon-jvm.properties
          test -d .media3/build-logic
          test -d .media3/build-logic-settings
          test -f .media3/libraries/ui_danmaku/build.gradle.kts
          cp .github/media3-composite-settings.gradle.kts .media3/settings.gradle.kts
          cat > "$RUNNER_TEMP/tv-sdk-compat.init.gradle" <<'GRADLE'
          gradle.beforeProject { p ->
              ['com.android.application', 'com.android.library'].each { pluginId ->
                  p.pluginManager.withPlugin(pluginId) {
                      p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                          if (dsl.compileSdk == 37) dsl.compileSdkMinor = 0
                      }
                  }
              }
          }
          GRADLE
          chmod +x gradlew
      - name: Rebuild pinned legacy and modern spider DEX fixtures
        if: inputs.wasm
        run: python3 .github/scripts/prepare-spider-api-fixtures.py
      - name: Build TV preview and run local unit tests
        env:
          MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
          TMDB_API_KEY: ${{ inputs.live_home && 'tmdb-live-preview' || (inputs.compact_home || inputs.home_background) && 'compact-ui-fixture' || '' }}
          ASSRT_API_TOKEN: ${{ (inputs.assrt_subtitles || inputs.variety_episodes) && 'assrt-ui-fixture' || '' }}
        run: ./gradlew -I "$RUNNER_TEMP/tv-sdk-compat.init.gradle" :app:assembleLeanbackArm64_v8aPreview :app:assembleLeanbackArm64_v8aPreviewAndroidTest :app:testLeanbackArm64_v8aPreviewUnitTest ${{ inputs.wasm && ':wasm:testDebugUnitTest' || '' }} -PtvPreview --no-daemon --build-cache --max-workers=2 --console=plain
      - name: Prepare QuickJS and AVIF for the x86_64 preview emulator
        run: python3 .github/scripts/prepare-quickjs-preview.py
      - name: Upload preview APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-preview-apk${{ inputs.wasm && format('-wasm-api-{0}', matrix.api) || '' }}
          path: app/build/outputs/apk/leanbackArm64_v8a/preview/*.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare emulator checks
        env:
          TV_COMPACT_HOME: ${{ inputs.compact_home }}
          TV_HOME_BACKGROUND: ${{ inputs.home_background }}
          TV_LIVE_HOME: ${{ inputs.live_home }}
          TV_EPISODE_NAVIGATION: ${{ inputs.episode_navigation }}
          TV_VARIETY_EPISODES: ${{ inputs.variety_episodes }}
          TV_ASSRT_SUBTITLES: ${{ inputs.assrt_subtitles }}
          TV_UPSTREAM_STABILITY: ${{ inputs.upstream_stability }}
          TV_WASM: ${{ inputs.wasm }}
          TV_PLAYBACK_CLOCK: ${{ inputs.playback_clock }}
          TV_EMULATOR_API: ${{ matrix.api }}
        run: |
          cat > "$RUNNER_TEMP/verify-tv-home.sh" <<'VERIFY'
          set -euo pipefail
          if [ "$TV_WASM" = 'true' ]; then
            bash .github/scripts/verify-wasm.sh "$TV_EMULATOR_API"
          elif [ "$TV_PLAYBACK_CLOCK" = 'true' ]; then
            python3 - <<'PY'
          import json, pathlib, subprocess
          for root in ('app/build/outputs/apk/leanbackArm64_v8a/preview',
                       'app/build/outputs/apk/androidTest/leanbackArm64_v8a/preview'):
              directory = pathlib.Path(root)
              data = json.loads((directory / 'output-metadata.json').read_text())
              assert data['applicationId'] in ('com.fongmi.android.tv.preview', 'com.fongmi.android.tv.preview.test')
              subprocess.run(['adb', 'install', '-r', str(directory / data['elements'][0]['outputFile'])], check=True)
          PY
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell settings put secure immersive_mode_confirmations confirmed
            UPSTREAM_NATIVE_UI_EVIDENCE=true bash .github/scripts/verify-upstream-features.sh \
              com.fongmi.android.tv.ui.PlaybackClockIntegrationTest artifacts/playback-clock '3'
          elif [ "$TV_VARIETY_EPISODES" = 'true' ]; then
            python3 - <<'PY'
          import json, pathlib, subprocess
          for root in ('app/build/outputs/apk/leanbackArm64_v8a/preview',
                       'app/build/outputs/apk/androidTest/leanbackArm64_v8a/preview'):
              directory = pathlib.Path(root)
              data = json.loads((directory / 'output-metadata.json').read_text())
              assert len(data['elements']) == 1
              assert data['applicationId'] in ('com.fongmi.android.tv.preview', 'com.fongmi.android.tv.preview.test')
              subprocess.run(['adb', 'install', '-r', str(directory / data['elements'][0]['outputFile'])], check=True)
          PY
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell settings put secure immersive_mode_confirmations confirmed
            suites=(
              com.fongmi.android.tv.playback.vod.EpisodeNavigationAndroidTest=22
              com.fongmi.android.tv.api.LogvarMatchingAndroidTest=14
              com.fongmi.android.tv.api.AssrtSubtitleSearchAndroidTest=11
              com.fongmi.android.tv.playback.vod.ExplicitEpisodeSelectionAndroidTest=7
              com.fongmi.android.tv.db.HistoryGeneratedLabelAndroidTest=2
              com.fongmi.android.tv.bean.VodContentRatingParcelTest=2
              com.fongmi.android.tv.playback.vod.DanmakuPlaybackOwnershipAndroidTest=3
            )
            classes=()
            counts=()
            for suite in "${suites[@]}"; do
              classes+=("${suite%=*}")
              counts+=("${suite##*=}")
            done
            IFS=,
            UPSTREAM_NATIVE_UI_EVIDENCE=true bash .github/scripts/verify-upstream-features.sh "${classes[*]}" artifacts/variety-episodes "${counts[*]}"
            unset IFS
          elif [ "$TV_UPSTREAM_STABILITY" = 'true' ]; then
            python3 - <<'PY'
          import json, pathlib, subprocess
          for root in ('app/build/outputs/apk/leanbackArm64_v8a/preview',
                       'app/build/outputs/apk/androidTest/leanbackArm64_v8a/preview'):
              directory = pathlib.Path(root)
              data = json.loads((directory / 'output-metadata.json').read_text())
              assert len(data['elements']) == 1
              assert data['applicationId'] in ('com.fongmi.android.tv.preview', 'com.fongmi.android.tv.preview.test')
              subprocess.run(['adb', 'install', '-r', str(directory / data['elements'][0]['outputFile'])], check=True)
          PY
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell settings put secure immersive_mode_confirmations confirmed
            suites=(
              com.fongmi.android.tv.playback.vod.ExplicitEpisodeSelectionAndroidTest=7
              com.fongmi.android.tv.test.FolderFilterNavigationTest=6
              com.fongmi.android.tv.ui.custom.SeekKeyOwnershipAndroidTest=7
              com.fongmi.android.tv.service.PlaybackOwnershipAndroidTest=11
              com.fongmi.android.tv.playback.vod.DanmakuPlaybackOwnershipAndroidTest=3
              com.fongmi.android.tv.service.PlaybackSessionPlayerAndroidTest=5
              com.fongmi.android.tv.player.TimeshiftExoIntegrationTest=2
              com.fongmi.android.tv.api.AssrtSubtitleSearchAndroidTest=11
              com.fongmi.android.tv.playback.vod.EpisodeNavigationAndroidTest=22
              com.fongmi.android.tv.bean.VodContentRatingParcelTest=2
              com.fongmi.android.tv.db.HistoryGeneratedLabelAndroidTest=2
              com.fongmi.android.tv.api.LogvarMatchingAndroidTest=14
            )
            classes=()
            counts=()
            for suite in "${suites[@]}"; do
              classes+=("${suite%=*}")
              counts+=("${suite##*=}")
            done
            IFS=,
            UPSTREAM_NATIVE_UI_EVIDENCE=true bash .github/scripts/verify-upstream-features.sh "${classes[*]}" artifacts/fongmi-stability "${counts[*]}"
            unset IFS
          elif [ "$TV_ASSRT_SUBTITLES" = 'true' ]; then
            out=artifacts/assrt-subtitles
            mkdir -p "$out"
            python3 - <<'PY'
          import json, pathlib, subprocess
          for root in ('app/build/outputs/apk/leanbackArm64_v8a/preview',
                       'app/build/outputs/apk/androidTest/leanbackArm64_v8a/preview'):
              directory = pathlib.Path(root)
              data = json.loads((directory / 'output-metadata.json').read_text())
              assert len(data['elements']) == 1
              assert data['applicationId'] in ('com.fongmi.android.tv.preview', 'com.fongmi.android.tv.preview.test')
              subprocess.run(['adb', 'install', '-r', str(directory / data['elements'][0]['outputFile'])], check=True)
          PY
            adb shell wm size 1920x1080
            adb shell wm density 320
            collect_assrt() {
              adb pull /sdcard/Android/data/com.fongmi.android.tv.preview/files/native-usability-evidence "$out/screenshots" >/dev/null 2>&1 || true
              adb logcat -b all -d -v threadtime > "$out/logcat.txt" 2>&1 || true
              adb exec-out screencap -p > "$out/last-screen.png" 2>/dev/null || true
            }
            trap collect_assrt EXIT
            adb logcat -c
            adb shell am instrument -w -r -e native_ui_evidence true -e class com.fongmi.android.tv.api.AssrtSubtitleSearchAndroidTest \
              com.fongmi.android.tv.preview.test/androidx.test.runner.AndroidJUnitRunner | tee "$out/instrumentation.txt"
            python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path('artifacts/assrt-subtitles')
          output = (root / 'instrumentation.txt').read_text()
          match = re.search(r'^OK \(([1-9][0-9]*) tests?\)', output, re.M)
          summary = {'headSha': os.environ['GITHUB_SHA'], 'passed': bool(match),
                     'passedTests': int(match[1]) if match else 0,
                     'scope': 'Local ASSRT HTTP, shipping TV dialogs and Exo subtitles; no live service or MPV native rendering'}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          if not match:
              raise SystemExit('ASSRT subtitle instrumentation failed')
          PY
            collect_assrt
          elif [ "$TV_EPISODE_NAVIGATION" = 'true' ]; then
            python3 - <<'PY'
          import json, pathlib, subprocess
          for root in ('app/build/outputs/apk/leanbackArm64_v8a/preview',
                       'app/build/outputs/apk/androidTest/leanbackArm64_v8a/preview'):
              directory = pathlib.Path(root)
              data = json.loads((directory / 'output-metadata.json').read_text())
              assert len(data['elements']) == 1
              assert data['applicationId'] in ('com.fongmi.android.tv.preview', 'com.fongmi.android.tv.preview.test')
              subprocess.run(['adb', 'install', '-r', str(directory / data['elements'][0]['outputFile'])], check=True)
          PY
            adb shell wm size 1920x1080
            adb shell wm density 320
            bash .github/scripts/verify-upstream-features.sh com.fongmi.android.tv.playback.vod.EpisodeNavigationAndroidTest,com.fongmi.android.tv.db.HistoryGeneratedLabelAndroidTest,com.fongmi.android.tv.api.LogvarMatchingAndroidTest
          elif [ "$TV_HOME_BACKGROUND" = 'true' ]; then
            python3 - <<'PY'
          import json, pathlib, subprocess
          outputs = (
              ('app/build/outputs/apk/leanbackArm64_v8a/preview', 'com.fongmi.android.tv.preview'),
              ('app/build/outputs/apk/androidTest/leanbackArm64_v8a/preview', 'com.fongmi.android.tv.preview.test'),
          )
          for root, package in outputs:
              directory = pathlib.Path(root)
              data = json.loads((directory / 'output-metadata.json').read_text())
              assert len(data['elements']) == 1, 'Expected one isolated preview APK'
              assert data['applicationId'] == package, 'Unexpected APK application ID'
              subprocess.run(['adb', 'install', '-r', str(directory / data['elements'][0]['outputFile'])], check=True)
          PY
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell pm grant com.fongmi.android.tv.preview android.permission.POST_NOTIFICATIONS
            # Clear only the disposable emulator's launcher, which can steal native app focus.
            adb shell am force-stop com.google.android.apps.nexuslauncher
            UPSTREAM_NATIVE_UI_EVIDENCE=true bash .github/scripts/verify-upstream-features.sh \
              com.fongmi.android.tv.test.HomeBackgroundHomePreviewTest,com.fongmi.android.tv.ui.HomeBackgroundBlendAndroidTest \
              artifacts/home-background '1,6'
          elif [ "$TV_LIVE_HOME" = 'true' ]; then
            bash .github/scripts/verify-live-home.sh
          elif [ "$TV_COMPACT_HOME" = 'true' ]; then
            out=artifacts/compact-home
            mkdir -p "$out"
            python3 - <<'PY'
          import json, pathlib, subprocess
          for root in ('app/build/outputs/apk/leanbackArm64_v8a/preview',
                       'app/build/outputs/apk/androidTest/leanbackArm64_v8a/preview'):
              directory = pathlib.Path(root)
              data = json.loads((directory / 'output-metadata.json').read_text())
              assert len(data['elements']) == 1
              assert data['applicationId'] in ('com.fongmi.android.tv.preview', 'com.fongmi.android.tv.preview.test')
              subprocess.run(['adb', 'install', '-r', str(directory / data['elements'][0]['outputFile'])], check=True)
          PY
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell pm grant com.fongmi.android.tv.preview android.permission.POST_NOTIFICATIONS || true
            collect_compact() {
              adb pull /sdcard/Android/data/com.fongmi.android.tv.preview/files/native-usability-evidence "$out/" >/dev/null 2>&1 || true
              adb logcat -b all -d -v threadtime > "$out/logcat.txt" 2>&1 || true
              adb exec-out screencap -p > "$out/last-screen.png" 2>/dev/null || true
            }
            trap collect_compact EXIT
            adb logcat -c
            classes=com.fongmi.android.tv.test.CompactHomeIntegrationTest,com.fongmi.android.tv.ui.CompactDiscoveryIntegrationTest,com.fongmi.android.tv.ui.TmdbConnectionSettingsIntegrationTest
            adb shell am instrument -w -r -e native_ui_evidence true -e class "$classes" \
              com.fongmi.android.tv.preview.test/androidx.test.runner.AndroidJUnitRunner | tee "$out/instrumentation.txt"
            python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path('artifacts/compact-home')
          output = (root / 'instrumentation.txt').read_text()
          match = re.search(r'^OK \(([1-9][0-9]*) tests?\)', output, re.M)
          summary = {'headSha': os.environ['GITHUB_SHA'], 'passed': bool(match),
                     'passedTests': int(match[1]) if match else 0}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          if not match:
              raise SystemExit('Compact home instrumentation failed')
          PY
            collect_compact
            bash .github/scripts/verify-upstream-features.sh com.fongmi.android.tv.test.FolderFilterNavigationTest,com.fongmi.android.tv.test.SpiderDialogTest
          else
            bash .github/scripts/verify-tv-ui.sh
            bash .github/scripts/verify-upstream-features.sh com.fongmi.android.tv.test.FolderFilterNavigationTest,com.fongmi.android.tv.test.SpiderDialogTest,com.fongmi.android.tv.player.TimeshiftPlaybackAndroidTest,com.fongmi.android.tv.service.PlaybackSessionPlayerAndroidTest,com.fongmi.android.tv.test.TimeshiftControlsTest,com.fongmi.android.tv.player.TimeshiftExoIntegrationTest
            bash .github/scripts/verify-playback-specs.sh
          fi
          VERIFY
      - name: Prepare runtime TMDB preview credential
        if: inputs.live_home && !inputs.upstream_stability && !inputs.variety_episodes && !inputs.wasm
        env:
          TMDB_PREVIEW_KEY: ${{ secrets.TV94_TMDB_PREVIEW_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          secret = os.environ.get('TMDB_PREVIEW_KEY', '').strip()
          assert re.fullmatch(r'[a-fA-F0-9]{32}', secret), 'Configure TV94_TMDB_PREVIEW_KEY before live verification'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tv-tmdb-preview.key'
          target.write_text(secret)
          target.chmod(0o600)
          PY
      - name: Prepare host memory diagnostics for background verification
        if: inputs.home_background
        run: |
          mkdir -p artifacts/home-background/emulator-host
          free -m > artifacts/home-background/emulator-host/memory-before.txt
          ps -eo pid,ppid,rss,args --sort=-rss > artifacts/home-background/emulator-host/processes-before.txt
          jps -lv > artifacts/home-background/emulator-host/java-processes-before.txt
          python3 - <<'PY'
          import os, pathlib, signal, subprocess
          # Compilation is complete. Release only Kotlin daemons left by this disposable build.
          lines = subprocess.check_output(['jps', '-l'], text=True).splitlines()
          released = []
          for line in lines:
              fields = line.split()
              if len(fields) == 2 and fields[1] == 'org.jetbrains.kotlin.daemon.KotlinCompileDaemon':
                  pid = int(fields[0])
                  try:
                      os.kill(pid, signal.SIGTERM)
                      released.append(pid)
                  except ProcessLookupError:
                      pass
          pathlib.Path('artifacts/home-background/emulator-host/released-kotlin-daemons.txt').write_text(
              '\n'.join(map(str, released)) + '\n')
          PY
          free -m > artifacts/home-background/emulator-host/memory-after.txt
          cat > "$RUNNER_TEMP/watch-home-emulator-host.sh" <<'WATCH'
          set -u
          output=artifacts/home-background/emulator-host
          for iteration in $(seq 1 120); do
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            free -m
            ps -eo pid,ppid,rss,args --sort=-rss | head -n 16
            for counter in memory.current memory.peak memory.events; do
              path="/sys/fs/cgroup/$counter"
              if [ -f "$path" ]; then printf '%s\n' "$path"; cat "$path"; fi
            done
            sleep 10
          done >> "$output/memory-timeline.txt" 2>&1
          WATCH
      - name: Verify themes and touch on emulator
        timeout-minutes: ${{ inputs.home_background && 20 || 40 }}
        env:
          TV_COMPACT_HOME: ${{ inputs.compact_home }}
          TV_HOME_BACKGROUND: ${{ inputs.home_background }}
          TV_LIVE_HOME: ${{ inputs.live_home }}
          TV_EPISODE_NAVIGATION: ${{ inputs.episode_navigation }}
          TV_VARIETY_EPISODES: ${{ inputs.variety_episodes }}
          TV_ASSRT_SUBTITLES: ${{ inputs.assrt_subtitles }}
          TV_UPSTREAM_STABILITY: ${{ inputs.upstream_stability }}
          TV_WASM: ${{ inputs.wasm }}
          TV_PLAYBACK_CLOCK: ${{ inputs.playback_clock }}
          TV_EMULATOR_API: ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          # A normal AOSP image keeps real HWUI rendering without Google startup services.
          target: ${{ inputs.home_background && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          # Official Android Emulator 36.3.10 stable archive.
          emulator-build: ${{ inputs.home_background && '14472402' || '' }}
          ram-size: ${{ inputs.home_background && '2048M' || '' }}
          heap-size: ${{ inputs.home_background && '256M' || '' }}
          disable-animations: true
          emulator-boot-timeout: ${{ inputs.home_background && 300 || 600 }}
          emulator-options: -no-window -gpu ${{ inputs.home_background && 'swiftshader' || 'swiftshader_indirect' }} -noaudio -no-boot-anim -camera-back none -camera-front none ${{ inputs.home_background && '-feature -Vulkan -no-snapshot -memory 2048' || '' }}
          pre-emulator-launch-script: ${{ inputs.home_background && 'nohup timeout --kill-after=5s 1200s bash "$RUNNER_TEMP/watch-home-emulator-host.sh" </dev/null >/dev/null 2>&1 & echo $! > "$RUNNER_TEMP/home-emulator-host-watcher.pid"' || '' }}
          script: bash "$RUNNER_TEMP/verify-tv-home.sh"
      - name: Remove runtime preview credential
        if: always() && inputs.live_home && !inputs.upstream_stability && !inputs.variety_episodes && !inputs.wasm
        run: |
          python3 - <<'PY'
          import os, pathlib
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tv-tmdb-preview.key').unlink(missing_ok=True)
          PY
      - name: Preserve emulator host crash reports
        if: always() && inputs.home_background
        run: |
          python3 - <<'PY'
          import os, pathlib, signal, shutil, subprocess
          output = pathlib.Path('artifacts/home-background/emulator-host')
          output.mkdir(parents=True, exist_ok=True)
          watcher = pathlib.Path(os.environ['RUNNER_TEMP']) / 'home-emulator-host-watcher.pid'
          if watcher.is_file():
              try:
                  os.kill(int(watcher.read_text().strip()), signal.SIGTERM)
              except ProcessLookupError:
                  pass
          for source in pathlib.Path('/tmp/android-runner').glob('emu-crash-*'):
              if source.is_file():
                  shutil.copy2(source, output / source.name)
              elif source.is_dir():
                  shutil.copytree(source, output / source.name, dirs_exist_ok=True)
          for name, command in (
              ('memory-final.txt', ['free', '-m']),
              ('processes-final.txt', ['ps', '-eo', 'pid,ppid,rss,args', '--sort=-rss']),
              ('kernel-log.txt', ['sudo', '-n', 'dmesg', '--ctime']),
          ):
              with (output / name).open('w') as report:
                  try:
                      subprocess.run(command, stdout=report, stderr=subprocess.STDOUT, timeout=15, check=False)
                  except subprocess.TimeoutExpired:
                      report.write('\nDiagnostic command timed out.\n')
          PY
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-ui-verification-${{ github.run_id }}${{ inputs.wasm && format('-wasm-api-{0}', matrix.api) || '' }}
          path: |
            artifacts/tv-ui/
            artifacts/upstream-features/
            artifacts/playback-specs/
            artifacts/playback-clock/
            artifacts/compact-home/
            artifacts/home-background/
            artifacts/live-home/
            artifacts/assrt-subtitles/
            artifacts/fongmi-stability/
            artifacts/variety-episodes/
            artifacts/wasm/
            app/build/test-results/
            app/build/reports/tests/
            wasm/build/test-results/
            wasm/build/reports/tests/
            app/schemas/
          if-no-files-found: warn
          retention-days: 14
