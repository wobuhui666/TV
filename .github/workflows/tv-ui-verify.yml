name: TV appearance and touch verification

on:
  push:
    branches: ['feat/tv-touch-light-theme', 'feat/tv-touch-light-theme-issue77', 'fix/home-history-order-touch']
  workflow_dispatch:
    inputs:
      responsiveness:
        description: Measure app responsiveness with the live aiwex configuration
        type: boolean
        default: false
      baseline_ref:
        description: Baseline commit for responsiveness comparison
        type: string
        default: '839ec53dea1a01879cbc42d11e7a7a475768c67e'
      compare_baseline:
        description: Also build the baseline, or rerun only optimized checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: tv-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsiveness:
    if: github.event_name == 'workflow_dispatch' && inputs.responsiveness
    uses: ./.github/workflows/app-responsiveness.yml
    with:
      baseline_ref: ${{ inputs.baseline_ref }}
      compare_baseline: ${{ inputs.compare_baseline }}
  verify:
    if: ${{ !inputs.responsiveness }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install Pillow
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Checkout Media3 fork
        uses: actions/checkout@v4
        with:
          repository: wobuhui666/media
          ref: 342f6590e02ac390e0bd6b4488b8a1bff55747c1
          path: .media3
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare SDK and composite build
        run: |
          printf 'toolchainVersion=21\n' > gradle/gradle-daemon-jvm.properties
          test -d .media3/build-logic
          test -d .media3/build-logic-settings
          test -f .media3/libraries/ui_danmaku/build.gradle.kts
          cp .github/media3-composite-settings.gradle.kts .media3/settings.gradle.kts
          cat > "$RUNNER_TEMP/tv-sdk-compat.init.gradle" <<'GRADLE'
          gradle.beforeProject { p ->
              ['com.android.application', 'com.android.library'].each { pluginId ->
                  p.pluginManager.withPlugin(pluginId) {
                      p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                          if (dsl.compileSdk == 37) dsl.compileSdkMinor = 0
                      }
                  }
              }
          }
          GRADLE
          chmod +x gradlew
      - name: Build TV preview and run local unit tests
        env:
          MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
        run: ./gradlew -I "$RUNNER_TEMP/tv-sdk-compat.init.gradle" :app:assembleLeanbackArm64_v8aPreview :app:assembleLeanbackArm64_v8aPreviewAndroidTest :app:testLeanbackArm64_v8aPreviewUnitTest -PtvPreview --no-daemon --build-cache --max-workers=2 --console=plain
      - name: Prepare QuickJS for the x86_64 preview emulator
        run: python3 .github/scripts/prepare-quickjs-preview.py
      - name: Upload preview APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-preview-apk
          path: app/build/outputs/apk/leanbackArm64_v8a/preview/*.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify themes and touch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            bash .github/scripts/verify-tv-ui.sh
            bash .github/scripts/verify-upstream-features.sh com.fongmi.android.tv.test.FolderFilterNavigationTest,com.fongmi.android.tv.test.SpiderDialogTest,com.fongmi.android.tv.player.TimeshiftPlaybackAndroidTest,com.fongmi.android.tv.service.PlaybackSessionPlayerAndroidTest,com.fongmi.android.tv.test.TimeshiftControlsTest,com.fongmi.android.tv.player.TimeshiftExoIntegrationTest
            bash .github/scripts/verify-playback-specs.sh
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-ui-verification-${{ github.run_id }}
          path: |
            artifacts/tv-ui/
            artifacts/upstream-features/
            artifacts/playback-specs/
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
