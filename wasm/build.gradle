plugins {
    alias libs.plugins.android.library
}

android {
    namespace = 'com.fongmi.android.tv.wasm'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

def chicoryRuntimeInput = configurations.create('chicoryRuntimeInput') {
    canBeConsumed = false
    transitive = false
}
def androidRuntime = layout.buildDirectory.file('generated/chicory/runtime-android-1.4.1.jar')
def prepareChicory = tasks.register('prepareChicoryAndroid', Exec) {
    inputs.files(chicoryRuntimeInput)
    inputs.file(rootProject.file('third_party/chicory/prepare_android.py'))
    outputs.file(androidRuntime)
    doFirst {
        commandLine 'python3', rootProject.file('third_party/chicory/prepare_android.py').absolutePath,
                '--input', chicoryRuntimeInput.singleFile.absolutePath,
                '--output', androidRuntime.get().asFile.absolutePath
    }
}

dependencies {
    add('chicoryRuntimeInput', 'com.dylibso.chicory:runtime:1.4.1')
    implementation files(androidRuntime).builtBy(prepareChicory)
    implementation 'com.dylibso.chicory:wasm:1.4.1'
    coreLibraryDesugaring libs.desugar
    testImplementation libs.junit
}
