plugins {
    alias libs.plugins.android.library
}

android {
    namespace = 'com.github.catvod.crawler'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    api project(':wasm')
    api libs.annotation
    api libs.brotli
    api libs.bundles.okhttp
    implementation libs.conscrypt.android
    api libs.gson
    api libs.guava
    api libs.juniversalchardet
    api libs.logger
    api libs.preference
    api libs.sardine
    api libs.smbj
    api libs.startup
    api libs.zxing.core
    coreLibraryDesugaring libs.desugar
    testImplementation libs.junit
    testImplementation "com.squareup.okhttp3:mockwebserver3:${libs.versions.okhttp.get()}"
    testImplementation "com.squareup.okhttp3:okhttp-tls:${libs.versions.okhttp.get()}"
}
